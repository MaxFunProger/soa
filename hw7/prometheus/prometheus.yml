global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: cinema-hw7

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: producer
    metrics_path: /metrics
    static_configs:
      - targets: ["producer:8000"]
        labels:
          service: producer

  - job_name: aggregation
    metrics_path: /metrics
    static_configs:
      - targets: ["aggregation:8010"]
        labels:
          service: aggregation

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
