global:
  resolve_timeout: 1m

route:
  receiver: null-receiver
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m

# Реальная интеграция (Slack/PagerDuty/email) условием задания не требуется.
# Достаточно показать, что alert уезжает в Alertmanager и виден в его UI;
# поэтому receiver — заглушка без webhook'ов.
receivers:
  - name: null-receiver

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["service"]
