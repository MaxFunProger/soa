global:
  resolve_timeout: 1m

route:
  receiver: log-sink
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: log-sink
    webhook_configs:
      - url: "http://prometheus:9090/-/healthy"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["service"]
