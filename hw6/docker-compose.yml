services:
  # ===========================================================================
  # Kafka cluster (KRaft mode, 2 brokers) + Schema Registry
  # ===========================================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "wzMR68byQ4SC1ojQwQTMRA"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "wzMR68byQ4SC1ojQwQTMRA"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ===========================================================================
  # Cassandra 3-node cluster (NetworkTopologyStrategy, RF=3)
  # ===========================================================================
  cassandra-1:
    image: cassandra:4.1
    hostname: cassandra-1
    container_name: cassandra-1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: warehouse-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_NUM_TOKENS: "16"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-2:
    image: cassandra:4.1
    hostname: cassandra-2
    container_name: cassandra-2
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: warehouse-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_NUM_TOKENS: "16"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-3:
    image: cassandra:4.1
    hostname: cassandra-3
    container_name: cassandra-3
    depends_on:
      cassandra-2:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: warehouse-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_NUM_TOKENS: "16"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "100M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local;' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Применение миграций; запускается один раз и завершается успешно.
  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra-1:
        condition: service_healthy
      cassandra-2:
        condition: service_healthy
      cassandra-3:
        condition: service_healthy
    environment:
      CASSANDRA_HOST: cassandra-1
      CASSANDRA_PORT: "9042"
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./cassandra/init:/migrations:ro
      - ./cassandra/scripts:/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/scripts/wait_and_apply.sh"]
    restart: "no"

  # ===========================================================================
  # WMS Producer (HTTP API + generator)
  # ===========================================================================
  producer:
    build:
      context: ./producer
    hostname: producer
    container_name: producer
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_NAME: "warehouse-events"
      DLQ_TOPIC_NAME: "warehouse-events-dlq"
      TOPIC_PARTITIONS: "3"
      TOPIC_REPLICATION_FACTOR: "2"
      TOPIC_MIN_INSYNC_REPLICAS: "1"
      SCHEMAS_DIR: "/app/schemas"
      GENERATOR_ENABLED: "true"
      GENERATOR_EPS: "2"
      LOG_LEVEL: "INFO"
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===========================================================================
  # Consumer service (state-keeper, writes to Cassandra)
  # ===========================================================================
  consumer:
    build:
      context: ./consumer
    hostname: consumer
    container_name: consumer
    ports:
      - "9100:9100"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      TOPIC_NAME: "warehouse-events"
      DLQ_TOPIC_NAME: "warehouse-events-dlq"
      CONSUMER_GROUP: "warehouse-state-consumer"
      CASSANDRA_CONTACT_POINTS: "cassandra-1,cassandra-2,cassandra-3"
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: "warehouse"
      CASSANDRA_LOCAL_DC: "datacenter1"
      CASSANDRA_WRITE_CONSISTENCY: "QUORUM"
      CASSANDRA_READ_CONSISTENCY: "ONE"
      METRICS_PORT: "9100"
      SCHEMAS_DIR: "/app/schemas"
      LOG_LEVEL: "INFO"
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      schema-registry:
        condition: service_healthy
      producer:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; r=u.urlopen(\"http://localhost:9100/health\"); exit(0 if r.status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===========================================================================
  # Monitoring: Prometheus + Grafana
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    hostname: prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    hostname: grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
