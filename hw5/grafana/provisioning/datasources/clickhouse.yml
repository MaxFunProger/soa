apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: default
      defaultDatabase: cinema
      tlsSkipVerify: true
    secureJsonData:
      password: ""
    isDefault: true
    editable: true
